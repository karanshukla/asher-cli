[project]
name = "asher-cli"
version = "1.0.2"
description = "Terminal dashboard for Litter Robot (LR3/LR4/LR5) via the Whisker cloud API"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["litter-robot", "whisker", "tui", "terminal", "smart-home"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
]
dependencies = [
    "pylitterbot==2025.6.2",
    "textual>=0.47.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "keyring>=24.0.0",
    "tzlocal>=5.4",
    "plyer>=2.1.0",
]

[project.optional-dependencies]
mcp = ["pylitterbot[mcp]==2025.6.2"]

[project.scripts]
asher = "asher.__main__:main"
asher-mcp-launch = "asher.mcp_bridge:main"

[project.urls]
Homepage = "https://github.com/karanshukla/asher-cli"
Repository = "https://github.com/karanshukla/asher-cli"
Issues = "https://github.com/karanshukla/asher-cli/issues"
Changelog = "https://github.com/karanshukla/asher-cli/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "bump-my-version>=0.24",
    "poethepoet>=0.27",
    "textual-dev>=1.0",
    "watchfiles>=0.21",
    "git-cliff>=2.0",
]

[tool.poe.tasks]
lint   = "ruff check ."
fmt    = "ruff format --check ."
types  = "mypy asher/ --ignore-missing-imports"
test   = "pytest tests/ -v --tb=short"
security.cmd = "uvx --from bandit[toml] bandit -c pyproject.toml -r ."
security.help = "run the same Bandit scan as the Bandit workflow"
fix.sequence = [{cmd = "ruff check --fix ."}, {cmd = "ruff format ."}]
dev    = "textual run --dev asher/__main__.py"
watch  = "python watchrun.py"
changelog = "git cliff -c cliff.toml -o CHANGELOG.md"
changelog-release.cmd = "git cliff -c cliff.toml --tag v${version} -o CHANGELOG.md"
changelog-release.help = "regenerate CHANGELOG.md with the pending commits filed under vX.Y.Z instead of [Unreleased]"
changelog-release.args = [{ name = "version", positional = true, required = true }]
check.sequence = ["lint", "fmt", "types", "test"]
check.help = "run all CI checks locally"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["asher"]

# ── Ruff ──────────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # line-length enforced by formatter
    "B008",   # do not perform function calls in argument defaults
    "SIM108", # use ternary instead of if-else (often less readable)
]

[tool.ruff.lint.isort]
known-first-party = ["asher"]

# ── Mypy ──────────────────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.10"
warn_return_any = true
ignore_missing_imports = true  # pylitterbot and textual have incomplete stubs
exclude = ["asher/slash-commands"]

# ── bump-my-version ───────────────────────────────────────────────────────────

[tool.bumpversion]
current_version = "1.0.2"
commit = true
tag = true
tag_name = "v{new_version}"
pre_commit_hooks = ["uv lock", "git add uv.lock"]

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

# ── Bandit ────────────────────────────────────────────────────────────────────

# Read with `bandit -c pyproject.toml` (needs the `toml` extra). The GitHub
# Bandit workflow passes the same flag so CI and local runs agree.
# B101 (assert_used) stays enabled for asher/. `tests` is excluded from the scan
# entirely, so pytest's asserts never reach it — a hit therefore means a real
# assert in shipped code, where -O would strip it.
[tool.bandit]
exclude_dirs = ["tests", ".venv", ".git", "build", "dist"]
skips = [
    # blacklist — flags the `import subprocess` line itself. Each call site is
    # reviewed individually by B602-B607.
    "B404",
]

# ── Pytest ────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test*.py"]

# ── Coverage ──────────────────────────────────────────────────────────────────

[tool.coverage.run]
source = ["asher"]
omit = ["asher/__main__.py"]

[tool.coverage.report]
show_missing = true

