# git-cliff configuration — generates CHANGELOG.md from conventional commits.
# Docs: https://git-cliff.org/docs/configuration
#
# Usage:
#   uv run poe changelog                       # regenerate full CHANGELOG.md
#   git cliff --latest --strip header          # preview next-release notes (stdout)
#   git cliff --unreleased                     # preview [Unreleased] section (stdout)

[changelog]
header = """
# Changelog

All notable changes to asher-cli are documented here.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

Generated by [git-cliff](https://git-cliff.org) from conventional commits.

"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""
trim = true
footer = """
<!-- generated by git-cliff -->
"""
postprocessors = [
  # Drop the trailing two-space/whitespace that the body template can leave on
  # bullet lines, and collapse the blank lines the group loop emits.
  { pattern = ' +\n', replace = "\n" },
]

[git]
# Only consider commits that match a conventional prefix; skip merge/bump/Renovate
# noise silently so the changelog reads cleanly.
conventional_commits = true
filter_unconventional = false
require_conventional = false
split_commits = false

# A tag is a release boundary if it starts with "v" + a digit (matches v0.2.0,
# v1.0.0, etc.; ignores any stray non-version tags).
tag_pattern = "v[0-9].*"

# Skip the pre-conventional-commit 0.0.x releases — those entries predate
# `feat:`/`fix:` discipline and were pure noise ("Fix the stupid UV", "Test").
# v0.1.0 is the first release with curated conventional commits. The README's
# prose changelog remains the human narrative for the 0.0.x era.
skip_tags = "v0\\.0\\..*"

# How to sort tags/releases: newest first.
sort_commits = "newest"

# Treat these commit message prefixes as release noise — excluded entirely.
filter_commits = true
commit_preprocessors = [
  # Normalise scope to lowercase for grouping consistency.
  { pattern = '\((\w+)\)', replace = "(${1})" },
]
# Parser rules are evaluated top-to-bottom; a commit takes the FIRST rule that
# matches, so skip rules must come before the group assignments.
commit_parsers = [
  # Skip the noise first: GitHub merge commits, bump-my-version commits,
  # and Renovate dependency/action updates (both "Update ..." and the scoped
  # "chore(deps): update ..." form). Regex is case-sensitive by default.
  { message = "^Merge (pull request|branch|remote-tracking branch)", skip = true },
  { message = "^Bump version:", skip = true },
  # The commit that cuts a release is bookkeeping about the changelog itself —
  # it would otherwise appear as a Documentation entry in the very section it cut.
  { message = "^docs\\(changelog\\)", skip = true },
  { message = "^chore\\(deps\\)", skip = true },
  { message = "^[Uu]pdate (dependency|actions?|.*digest)", skip = true },
  # Then group the remaining conventional commits into Keep a Changelog buckets.
  { message = "^feat", group = "<!-- 01 -->🚀 Features" },
  { message = "^fix", group = "<!-- 02 -->🐛 Bug Fixes" },
  { message = "^perf", group = "<!-- 03 -->⚡ Performance" },
  { message = "^refactor", group = "<!-- 04 -->♻️ Refactor" },
  { message = "^revert", group = "<!-- 05 -->⏪ Reverted" },
  { message = "^docs", group = "<!-- 06 -->📚 Documentation" },
  { message = "^test", group = "<!-- 07 -->🧪 Tests" },
  { message = "^style", group = "<!-- 08 -->🎨 Styling" },
  { message = "^ci", group = "<!-- 09 -->👷 CI/CD" },
  { message = "^build", group = "<!-- 10 -->📦 Build" },
  { message = "^chore", group = "<!-- 11 -->🔧 Miscellaneous" },
]
# Protect tagged releases: never drop a tag from the changelog even if all its
# commits were filtered out above.
protect_breaking_commits = false

[remote.github]
owner = "karanshukla"
repo = "asher-cli"
