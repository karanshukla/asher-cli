name: Release

on:
  push:
    branches:
      - "release/*"

permissions:
  contents: write  # needed to create GitHub Releases
  id-token: write  # needed for PyPI OIDC trusted publishing

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Extract version from branch name
        id: version
        run: echo "version=${GITHUB_REF_NAME#release/}" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1

  github-release:
    name: Create GitHub Release
    needs: [build, publish]
    runs-on: ubuntu-latest
    steps:
      # Full history (fetch-depth: 0) so git-cliff can walk commits/tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install git-cliff
        run: uv tool install git-cliff
      - name: Generate release notes with git-cliff
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # Explicit -c cliff.toml avoids auto-discovering pyproject.toml.
          #
          # --latest resolves against tags that exist in the checkout, and --tag
          # does NOT promote the unreleased section to "latest" on its own. When
          # no v${VERSION} tag has been pushed yet the notes silently come out
          # one release stale, so materialize the tag before generating.
          git tag -f "v${VERSION}" "${GITHUB_SHA}"
          git cliff -c cliff.toml --latest --strip header -o RELEASE_NOTES.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "v${VERSION}" dist/* \
            --title "v${VERSION}" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag=false
